<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Pairing</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Weekly Pairing Countdown</h1>
    <div id="countdown">Loading...</div>

    <hr>

    <!-- Participants Section -->
    <section>
      <button id="signup-btn">Sign Up</button>
      <h2>Participants</h2>
      <ul id="participants-list"></ul>
    </section>

    <hr>

    <!-- Topics Section -->
    <section>
      <h2>Topics</h2>
      <div style="display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-bottom:10px;">
        <input type="text" id="topic-input" placeholder="Suggest a topic">
        <button id="submit-topic-btn">Submit Topic</button>
      </div>
      <ul id="topic-list"></ul>
    </section>

    <hr>

    <!-- Admin / Pairings Section -->
    <section>
      <button id="admin-login-btn">Admin Login</button>
      <button id="trigger-pairing-btn" style="display:none;">Trigger Pairing</button>
      <h2>Pairings</h2>
      <ul id="pairing-list"></ul>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
